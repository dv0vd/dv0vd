# Порты сервисов не должны попадать в диапазон ephemeral-портов ядра
# (net.ipv4.ip_local_port_range, по умолчанию 32768-60999). Иначе исходящее соединение может
# занять такой порт как локальный, и сервис (или проброс порта контейнера) не сможет его
# забиндить — "address already in use". Здесь из этого диапазона выводятся порты LiveKit, COTURN и SIP.
net.ipv4.ip_local_reserved_ports=${LIVEKIT_TURN_UDP_PORT},${LIVEKIT_TURN_TCP_PORT},${LIVEKIT_FALLBACK_PORT},${LIVEKIT_MIN_PORT}-${LIVEKIT_MAX_PORT},${LIVEKIT_TURN_MIN_PORT}-${LIVEKIT_TURN_MAX_PORT},${COTURN_PORT},${COTURN_TLS_PORT},${COTURN_MIN_PORT}-${COTURN_MAX_PORT},${SIP_PORT},${SIP_RTP_MIN_PORT}-${SIP_RTP_MAX_PORT}
