cert=/app/letsencrypt/live/$BASE_URL/fullchain.pem
pkey=/app/letsencrypt/live/$BASE_URL/privkey.pem
listening-port=3478
tls-listening-port=5349
min-port=$COTURN_MIN_PORT
max-port=$COTURN_MAX_PORT
external-ip=$PUBLIC_IP/0.0.0.0
fingerprint
use-auth-secret
static-auth-secret=$COTURN_SECRET
realm=$COTURN_HOST
verbose
log-file=stdout
no-multicast-peers
no-cli