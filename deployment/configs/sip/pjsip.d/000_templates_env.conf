[contact-endpoint](!)
type=endpoint
transport=transport-tls
context=internal
message_context=messages
from_domain=$BASE_URL

disallow=all
allow=alaw
allow=ulaw
allow=g722
allow=vp8

direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
media_address=$PUBLIC_IP

media_encryption=sdes
use_avpf=yes
ice_support=no

[contact-auth](!)
type=auth
auth_type=userpass

[contact-aor](!)
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=60
