[contact-endpoint](!)
type=endpoint
transport=transport-tls
context=internal

disallow=all
allow=alaw
allow=ulaw
allow=g722

direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

media_encryption=sdes
media_encryption_optimistic=yes
use_avpf=no
ice_support=no

[contact-auth](!)
type=auth
auth_type=userpass

[contact-aor](!)
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=60
