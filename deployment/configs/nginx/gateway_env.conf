http {
    include mime.types;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=100r/s;

    add_header X-Robots-Tag "noindex, nofollow" always;

    server {
        listen 443 ssl;
        server_name www.$GATEWAY_URL.$BASE_URL $GATEWAY_URL.$BASE_URL;
        ssl_certificate     /app/letsencrypt/certificates/live/$GATEWAY_URL.$BASE_URL/fullchain.pem;
        ssl_certificate_key /app/letsencrypt/certificates/live/$GATEWAY_URL.$BASE_URL/privkey.pem;

        limit_req zone=req_zone burst=100;

        if ($host = 'www.$GATEWAY_URL.$BASE_URL') {
            return 301 https://$GATEWAY_URL.$BASE_URL$request_uri;
        }

        location /dns-query {
            proxy_pass http://localhost:8053/dns-query;
            proxy_set_header Host "dns-query";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            proxy_buffering off;
        }
    }

}

events {}