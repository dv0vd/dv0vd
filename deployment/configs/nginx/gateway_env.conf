http {
    include mime.types;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=100r/s;

    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    server {
        listen 443 ssl;
        server_name www.$GATEWAY_URL.$BASE_URL $GATEWAY_URL.$BASE_URL;
        ssl_certificate     /app/letsencrypt/certificates/live/$GATEWAY_URL.$BASE_URL/fullchain.pem;
        ssl_certificate_key /app/letsencrypt/certificates/live/$GATEWAY_URL.$BASE_URL/privkey.pem;

        limit_req zone=req_zone burst=100;

        if ($host = 'www.$GATEWAY_URL.$BASE_URL') {
            return 301 https://$GATEWAY_URL.$BASE_URL$request_uri;
        }

        location /dns-query {
            auth_basic off;

            limit_req zone=req_zone burst=100 nodelay;

            proxy_pass http://127.0.0.1:8053/dns-query;
            proxy_set_header Host "dns-query";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            proxy_buffering off;
        }

        location ~ ^(/admin|/api) {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        location ~ ^/admin/.*\.(js|css|png|jpg|svg|jpeg|gif|ico|woff|woff2)$ {
            proxy_pass http://127.0.0.1:8080$request_uri;
        }
    }

}

events {}