http {
    include mime.types;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=100r/s;

    add_header X-Robots-Tag "noindex, nofollow" always;

    server {
        server_name _;
        listen 443 ssl;
        ssl_certificate /deployment/nginx/nginx.crt;
        ssl_certificate_key /deployment/nginx/nginx.key;
        limit_req zone=req_zone burst=10 nodelay;

        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location ~ ^(/admin|/api) {
            proxy_pass http://localhost:80;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        location ~ ^/admin/.*\.(js|css|png|jpg|svg|jpeg|gif|ico|woff|woff2)$ {
            proxy_pass http://localhost:80$request_uri;
        }
    }

    # Xray VLESS Reality edge certificates
    server {
        listen 80;
        server_name www.$VLESS_EDGE_URL.$BASE_URL $VLESS_EDGE_URL.$BASE_URL;
        limit_req zone=req_zone burst=100;

        location ^~ /.well-known/acme-challenge/ {
            alias /app/letsencrypt/acme/.well-known/acme-challenge/;
            default_type text/plain;
        }
    }
}

events {}