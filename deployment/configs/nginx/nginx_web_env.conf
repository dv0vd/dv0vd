http {
    include mime.types;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=100r/s;

    add_header X-Robots-Tag "noindex, nofollow" always;

    server {
        listen 80;
        server_name www.$BASE_URL $BASE_URL;

        location ^~ /.well-known/acme-challenge/ {
            alias /app/letsencrypt/acme/.well-known/acme-challenge/;
            default_type text/plain;
        }

        location / {
            return 301 https://$BASE_URL$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.$BASE_URL $BASE_URL;
        ssl_certificate     /app/letsencrypt/certificates/live/$BASE_URL/fullchain.pem;
        ssl_certificate_key /app/letsencrypt/certificates/live/$BASE_URL/privkey.pem;

        limit_req zone=req_zone burst=100;

        if ($host = 'www.$BASE_URL') {
            return 301 https://$BASE_URL$request_uri;
        }

        location / {
            root /app/public;
            index index.html;

            if ($request_uri ~ (.+)/$) {
                return 301 $scheme://$host$1;
            }
        }

        location /dns-query {
            proxy_pass http://doh-server:8053/dns-query;
            proxy_set_header Host "dns-query";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            proxy_buffering off;
        }
    }
}

events {}
