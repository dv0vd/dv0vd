http {
    include mime.types;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=100r/s;

    add_header X-Robots-Tag "noindex, nofollow" always;

    server {
        listen 80;
        server_name www.$BASE_URL $BASE_URL;
        limit_req zone=req_zone burst=100;

        location ^~ /.well-known/acme-challenge/ {
            alias /app/letsencrypt/acme/.well-known/acme-challenge/;
            default_type text/plain;
        }

        location / {
            return 301 https://$BASE_URL$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.$BASE_URL $BASE_URL;
        ssl_certificate     /app/letsencrypt/certificates/live/$BASE_URL/fullchain.pem;
        ssl_certificate_key /app/letsencrypt/certificates/live/$BASE_URL/privkey.pem;

        limit_req zone=req_zone burst=100;

        if ($host = 'www.$BASE_URL') {
            return 301 https://$BASE_URL$request_uri;
        }

        location / {
            root /app/public;
            index index.html;

            if ($request_uri ~ (.+)/$) {
                return 301 $scheme://$host$1;
            }
        }

        location /dns-query {
            proxy_pass http://doh-server:8053/dns-query;
            proxy_set_header Host "dns-query";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            proxy_buffering off;
        }

        location /certificates {
            root /app/public;
            autoindex on;
            add_header Content-Disposition "inline";
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri $uri/ =404;
        }

        location /demo/timers {
            proxy_pass http://demo-timers:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        location /demo/skillnotes {
            proxy_pass http://demo-skillnotes:3000;
            proxy_set_header Host $host;
        }

        location /demo/todo-manager/ {
            proxy_pass http://demo-todo-manager/;
        }

        location /demo/lagoona {
            alias /demo/demo-lagoona;
            index index.html;
        }

        location /demo/evklid {
            alias /demo/demo-evklid;
            index index.html;
        }

        location /demo/gazprombank {
            alias /demo/demo-gazprombank-auth;
            index login.html;
        }

        location /demo/gazprombank/register {
            alias /demo/demo-gazprombank-auth;
            index register.html;
        }

        location /demo/gazprombank/reset {
            alias /demo/demo-gazprombank-auth;
            index forgot-data.html;
        }

        location /demo/gazprombank/startups {
            alias /demo/demo-gazprombank-startups;
            index index.html;
        }

        location /pihole {
            alias /app/pihole;
            try_files $uri $uri/ =404;
        }

        location ~ ^(/_matrix|/_synapse/client) {
            proxy_pass http://synapse:8008;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host:$server_port;
            client_max_body_size 100M;
            proxy_http_version 1.1;
        }

        location = /.well-known/matrix/client {
            default_type application/json;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;

            return 200 '{
                "m.homeserver": {
                    "base_url": "https://$BASE_URL"
                },
                "org.matrix.msc4143.rtc_foci": [{
                    "type": "livekit",
                    "livekit_service_url": "https://$LIVEKIT_URL"
                }]
            }';
        }
    }

    server {
        listen 8448 ssl;
        server_name $BASE_URL;
        ssl_certificate     /app/letsencrypt/certificates/live/$BASE_URL/fullchain.pem;
        ssl_certificate_key /app/letsencrypt/certificates/live/$BASE_URL/privkey.pem;
        limit_req zone=req_zone burst=100;

        location / {
            proxy_pass http://synapse:8008;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host:$server_port;
            client_max_body_size 100M;
            proxy_http_version 1.1;
        }
    }

    # NTFY
    server {
        listen 80;
        server_name www.$NTFY_URL $NTFY_URL;
        limit_req zone=req_zone burst=100;

        location / {
            return 301 https://$NTFY_URL$request_uri;
        }
    }
    server {
        listen 443 ssl;
        server_name www.$NTFY_URL $NTFY_URL;
        ssl_certificate     /app/letsencrypt/certificates/live/$NTFY_URL/fullchain.pem;
        ssl_certificate_key /app/letsencrypt/certificates/live/$NTFY_URL/privkey.pem;

        location / {
            limit_except GET HEAD {
                allow 127.0.0.1;
                allow 10.100.0.0/16;
                deny all;
            }

            proxy_pass http://ntfy;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / streaming support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # важное для SSE/long connections
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            client_max_body_size 100M;
        }
    }

    # LiveKit + MatrixRTC
    server {
        listen 80;
        server_name www.$LIVEKIT_URL $LIVEKIT_URL;
        limit_req zone=req_zone burst=100;

        location / {
            return 301 https://$LIVEKIT_URL$request_uri;
        }
    }
    server {
        listen 443 ssl;
        server_name www.$LIVEKIT_URL $LIVEKIT_URL;
        ssl_certificate     /app/letsencrypt/certificates/live/$LIVEKIT_URL/fullchain.pem;
        ssl_certificate_key /app/letsencrypt/certificates/live/$LIVEKIT_URL/privkey.pem;

        # location ^~ /_matrix/ {
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     proxy_pass http://matrix-rtc:8080;
        # }

        location ^~ /jwt/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://matrix-rtc:8080;
        }

        location ^~ /sfu/ {
            proxy_hide_header Access-Control-Allow-Origin;
	        proxy_hide_header Access-Control-Allow-Methods;
	        proxy_hide_header Access-Control-Allow-Headers;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_send_timeout 120;
            proxy_read_timeout 120;
            proxy_buffering off;

            proxy_set_header Accept-Encoding gzip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://matrix-rtc:8080;
        }
    }
}

events {}
