server {
    server_name www.$PROXY_NAME.$BASE_URL $PROXY_NAME.$BASE_URL;
    listen 443 ssl;
    http2 on;
    ssl_certificate     /app/letsencrypt/certificates/live/$PROXY_NAME.$BASE_URL/fullchain.pem;
    ssl_certificate_key /app/letsencrypt/certificates/live/$PROXY_NAME.$BASE_URL/privkey.pem;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /v2/events {
        auth_basic off;

        proxy_pass http://127.0.0.1:$XRAY_VLESS_REALITY_PORT;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /dns-query {
        auth_basic off;

        limit_req zone=req_zone burst=250 nodelay;

        proxy_pass http://127.0.0.1:8053/dns-query;
        proxy_set_header Host "dns-query";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
    }

    location ~ ^(/admin|/api) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location ~ ^/admin/.*\.(js|css|png|jpg|svg|jpeg|gif|ico|woff|woff2)$ {
        proxy_pass http://127.0.0.1:8080$request_uri;
    }
}
