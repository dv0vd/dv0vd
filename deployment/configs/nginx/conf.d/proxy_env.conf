server {
    server_name www.$PROXY_NAME.$BASE_URL $PROXY_NAME.$BASE_URL;
    listen 443 ssl;
    ssl_certificate     /app/letsencrypt/certificates/live/$PROXY_NAME.$BASE_URL/fullchain.pem;
    ssl_certificate_key /app/letsencrypt/certificates/live/$PROXY_NAME.$BASE_URL/privkey.pem;
    limit_req zone=req_zone burst=10 nodelay;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /dns-query {
        auth_basic off;
        
        proxy_pass http://localhost:8053/dns-query;
        proxy_set_header Host "dns-query";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
    }

    location ~ ^(/admin|/api) {
        proxy_pass http://localhost:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location ~ ^/admin/.*\.(js|css|png|jpg|svg|jpeg|gif|ico|woff|woff2)$ {
        proxy_pass http://localhost:8080$request_uri;
    }
}