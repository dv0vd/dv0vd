log_format stream '$remote_addr [$time_local] sni=$ssl_preread_server_name backend=$backend_name '
                   'status=$status sent=$bytes_sent recv=$bytes_received time=$session_time';

access_log /var/log/nginx/stream.log stream;

map $ssl_preread_server_name $backend_name {
    $XRAY_URL.$PROXY_NAME.$BASE_URL xray_backend;
    default                         nginx_backend;
}

upstream xray_backend {
    server 127.0.0.1:$XRAY_VLESS_REALITY_PORT;
}

upstream nginx_backend {
    server 127.0.0.1:444;
}

server {
    listen 443;
    ssl_preread on;
    proxy_pass $backend_name;
}
